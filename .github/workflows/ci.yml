name: CI Pipeline

# Trigger on pull requests to main branch and manual dispatch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Allow manual trigger for debugging
  workflow_dispatch:

# Set permissions for the workflow
permissions:
  pull-requests: write
  contents: write
  checks: write

jobs:
  # Call the reusable validate workflow (lint, test, build)
  validate:
    name: Validate PR
    uses: JohanGustafsson91/toolkit/.github/workflows/validate.yml@main
    with:
      node-version: "20"
      package-manager: "pnpm"
      lint-script: "lint"
      test-script: "test"
      build-script: "build"

  # Firestore security rules, tested against the emulator (needs Java)
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules

  # Call the reusable auto-merge workflow for Dependabot PRs
  auto-merge:
    name: Auto-merge Dependabot PRs
    needs: [validate, rules]
    uses: JohanGustafsson91/toolkit/.github/workflows/auto-merge-dependabot.yml@main
    with:
      merge-method: squash
      # Major updates (incl. GitHub Actions, pinned by major tag) need a human review:
      # every merge to main is deployed with credentials that can reach user data.
      exclude: major
